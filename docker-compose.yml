version: '3.9'

services:
  ms-article:
    container_name: ms-article
    restart: always
    image: sonatype-nexus.backhole.ovh/ms-article-service:${version:-latest}
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 1
    ports:
      - "9010:9010"