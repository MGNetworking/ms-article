####### Micro-service
server.port=${PORT:0}
spring.application.name=ARTICLE-SERVICE

####### les log du server
# path defaut sur le serveur ubnutu /var/log/<nom du micro-service>.log
logging.file.name=/home/prod/log/ghoverblog/micro-service/article.log
logging.level.org.springframework.controller=DEBUG
logging.level.org.hibernate=DEBUG

####### Eureka
eureka.instance.instance-id=${spring.application.name}:${spring.application.intance_id:${random.value}}
eureka.client.service-url.defaultZone=http://localhost:8099/eureka/
spring.cloud.discovery.enabled=true

####### Base de donnees
