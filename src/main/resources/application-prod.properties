######## DevTool
spring.devtools.restart.enabled=true

####### actutor
# exposes all endpoints
management.endpoints.controller.exposure.include=*

###### gesiton des x-forward
server.forward-headers-strategy=NATIVE

###### keycloak
keycloak.realm=ghoverblog
# le nom de l'application ou du site dans keycloak
keycloak.resource=overblog_angular
# l'adress du server keycloak
keycloak.auth-server-url=https://keycloak.ghoverblog.ovh:8443/auth
# redirige le visteur vers le formulaire d'authentification
# l'utilisateur ne possede pas les droits | si false renvoi 401 si pas d'autrisation
keycloak.public-client=true

