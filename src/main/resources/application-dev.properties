# Profile dev local
info.profile=dev

######  gestion serveur
server.port=9010
# gestion des x-forward
server.forward-headers-strategy=NATIVE

###### MULTIPART (MultipartProperties)
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold ( => Au seuil) after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Multipart file limite -1 = infini size
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

###### Eureka
# renouvellement
# la fréquence à laquelle une instance doit renouveler son bail auprès du serveur Eureka
eureka.client.leaseRenewalIntervalInSeconds=15
# Activer la désinscription sur arrêt
eureka.client.should-unregister-on-shutdown=true
# représente la durée pendant laquelle l'instance à la permission de rester active sans renouveler son bail
eureka.instance.lease-expiration-duration-in-seconds=60
# Configurer un timeout de health check approprié
eureka.client.healthcheck.enabled=true
# indique la fréquence à laquelle le client Eureka effectue des vérifications d'état de santé
eureka.client.healthcheck.interval=30
# permet de spécifier le temps d'attente entre les requêtes de ping pendant la vérification d'état de santé
eureka.client.healthcheck.time-wait-between-pings-in-seconds=10

