################## keycloak
# Le domain
keycloak.realm=ghoverblog
# le nom de l'application ou du site dans keycloak
keycloak.resource=overblog_DEV
# specifier l'URL complete du serveur d'authentification Keycloak
keycloak.auth-server-url=http://localhost:8999
# exige le token bearer
keycloak.bearer-only=true
# en dev mais pas en prod
keycloak.ssl-required=none
# Indique si client prive=false ou public=true
keycloak.public-client=false

# Cors origine true l application permet l acces des aux ressources d un autre domain
# permet de communiquer avec keycloak et d'authentifier les utilisateurs
keycloak.cors=true

# Nécessaire pour que Spring valide les tokens JWT automatiquement.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8999/realms/ghoverblog
# Fournit l'endpoint JWKS pour récupérer les clés publiques et valider les signatures des tokens JWT.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8999/realms/ghoverblog/protocol/openid-connect/certs

################## Eureka client
# l adresse d'Eureka serveur sur le réseau local
#eureka.client.service-url.defaultZone=http://localhost:8099/eureka

# true indiquez au client Eureka de privilegier l utilisation de l adresse IP lors de l'enregistrement
eureka.instance.preferIpAddress=true
spring.application.name=ms-article

# Spécifie un identifiant unique pour l'enregistrement dans Eureka Serveur
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

################## Actuator
# exposes all endpoints
management.endpoints.health.show-detail=always
management.endpoints.web.exposure.include=*

################## DevTool
spring.devtools.restart.enabled=true

################## Error
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_trace_param
server.error.include-exception=false
